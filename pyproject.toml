[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "slo-budget-tracker"
version = "0.1.0"
description = "SLO + error-budget tracker for Python services (FastAPI middleware + Prometheus exporter)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Miz Causevic", email = "miz@kineticgain.com" },
]
keywords = ["slo", "sre", "error-budget", "burn-rate", "prometheus", "fastapi", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
    "starlette>=0.40",
]
dev = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage      = "https://github.com/mizcausevic-dev/slo-budget-tracker"
Repository    = "https://github.com/mizcausevic-dev/slo-budget-tracker"
Issues        = "https://github.com/mizcausevic-dev/slo-budget-tracker/issues"
"Author Site" = "https://kineticgain.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/slo_budget_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false
